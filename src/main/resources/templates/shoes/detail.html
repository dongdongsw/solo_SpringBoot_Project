<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<div class="wrapper" id="wrapper">
	  <div class="container" id="main">
	    <article id="content">
	      <header>
	        <h2>[[${vo.name_kor}]]</h2>
	        <p>[[${vo.brand}]]</p>
	      </header>
	      <div class="row">
	        <div class="col-3 col-12-medium">
	          <span class="image fit">
	            <img th:src="${vo.img}" referrerpolicy="no-referrer"  alt="신발 이미지">
	          </span>
	        </div>
	        <div class="col-9 col-12-medium">
	          <section class="box">
	            <ul>
	              <li><strong>제품 이름(영문)</strong> : [[${vo.name_eng}]]</li>
	              <li><strong>브랜드명</strong> : [[${vo.brand}]]</li>
	              <li>
	              <strong>카테고리 </strong>:
	              	<span th:if="${vo.category_id == 1 || vo.category_id == 2 }">스니커즈</span>
	              	<span th:if="${vo.category_id == 3}">샌들/슬리퍼</span>
	              	<span th:if="${vo.category_id == 4}">부츠</span>
	              	<span th:if="${vo.category_id == 5}">기타</span>
	              </li>
	              <li><strong>가격</strong> : [[${vo.im_sell}]]원</li>
	              <li><strong>일련번호</strong> : [[${vo.sku}]]</li>
	              <li><strong>색상</strong> : [[${vo.color}]]</li>
	              <li><strong>조회수</strong> : [[${vo.hit}]]</li>
	            </ul>
	          </section>
	        </div>
	      </div>
	    </article>
		<section id="comment-section">
		  <h3>댓글</h3>

		  <!-- 댓글 입력 -->
		  <form class="comment-form">
		    <textarea placeholder="댓글을 입력하세요" v-model="msg" ref="msg"></textarea>
		    <button type="button" class="button" @click="insert()">등록</button>
		    <div style="clear: both;"></div>
		  </form>

		  <!-- 댓글 목록 -->
		  <ul class="comment-list">
		    <li class="comment-item" v-for="cvo in list">
		      <div class="comment-header">
		        <div class="comment-user">
		          <strong> ((cvo.name)) </strong>
		          <span class="comment-date">((cvo.dbday))</span>
		        </div>

		        <!-- 작성자일 때만 보이게 -->
		        <div class="comment-actions" v-if="sessionId === cvo.id">
		          <button type="button" class="comment-edit upbtn" :id="'u'+cvo.no" @click="updateForm(cvo.no)">수정</button>
		          <button type="button" class="comment-delete" @click="deletes(cvo.no)">삭제</button>
		        </div>
		      </div>
		      <p class="comment-content"> ((cvo.msg)) </p>
			  <form class="comment-form ups" :id="'up'+cvo.no" style="display: none;">
	  		    <textarea placeholder="댓글을 입력하세요" :id="'umsg'+cvo.no">((cvo.msg))</textarea>
	  		    <button type="button" class="button" @click="update(cvo.no)">수정</button>
	  		    <div style="clear: both;"></div>
	  		  </form>
		    </li>
		  </ul>
		</section>
	  </div>
	</div>
	<script>
		const commentApp = Vue.createApp({
			data(){
				return{
					list:[],
					cno: '[[${vo.goods_id}]]',
					type:1,
					sessionId:'[[${sessionId}]]',
					msg:'',
					up:false
				}
				
			},
			mounted(){
				axios.get('http://localhost/comment/list_vue/',{
					params:{
						cno:this.cno,
						type:this.type
					}
				}).then(response=>{
					console.log(response.data)
					this.list = response.data.list
					this.cno = response.data.cno
					this.type = response.data.type
				})
			},
			methods:{
				insert(){
					if(this.msg === ""){
						this.$refs.msg.focus()
						return
					}
					axios.post('http://localhost/comment/insert_vue/',{
						cno:this.cno,
						type:this.type,
						msg:this.msg
					}).then(response=>{
						console.log(response.data)
						this.list = response.data.list
						this.cno = response.data.cno
						this.type = response.data.type
					})
					this.msg=""
					this.$refs.msg.focus()
				},
				update(no){
					let msg = $('#umsg'+no).val()
					if(msg == ""){
						$('#umsg'+no).focus()
						return
					}
					axios.get('http://localhost/comment/update_vue/',{
						params:{
							no:no,
							cno:this.cno,
							type:this.type,
							msg:msg
						}
					}).then(response=>{
							console.log(response.data)
							this.list = response.data.list
							this.cno = response.data.cno
							this.type = response.data.type
							$('#up'+no).hide()
							$('#u'+no).text("수정")
						})
				},
				updateForm(no){
					$('.ups').hide()
					$('.upbtn').text("수정")
					if(this.up === false){
						this.up = true
						$('#up'+no).show()
						$('#u'+no).text("취소")
					}
					else{
						this.up = false
						$('#up'+no).hide()
						$('#u'+no).text("수정")
					}
				},
				deletes(no){
					axios.get('http://localhost/comment/delete_vue/',{
						params:{
							no:no,
							cno:this.cno,
							type:this.type
						}
					}).then(response=>{
							console.log(response.data)
							this.list = response.data.list
							this.cno = response.data.cno
							this.type = response.data.type
						})
				}
			}
			
		})
		commentApp.config.compilerOptions.delimiters=['((','))']
		commentApp.mount("#wrapper")
		
	</script>
</body>
</html>
