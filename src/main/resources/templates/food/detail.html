<!DOCTYPE HTML>
<html>
<head>
<title>Telephasic by HTML5 UP</title>
</head>
<body class="no-sidebar is-preload">
	<div class="wrapper" id="wrapper">
		  <div class="container" id="main">
		    <article id="content">
		      <header>
				<h2>[[${vo.name}]]</h2>
				<p>[[${vo.address}]]</p>
		      </header>
		      <div class="row">
		        <div class="col-3 col-12-medium">
		          <span class="image ">
		            <img th:src="${vo.poster}" referrerpolicy="no-referrer" style="width: 330px;" alt="음식 이미지">
		          </span>
		        </div>
		        <div class="col-9 col-12-medium">
		          <section class="box">
		            <ul>
					<li><strong>가격</strong> : [[${vo.price}]]</li>
					<li><strong>종류</strong> : [[${vo.type}]]</li>
					<li><strong>전화번호</strong> : [[${vo.phone}]]</li>
					<li><strong>운영시간</strong> : [[${vo.time}]]</li>
					<li><strong>주차</strong> : [[${vo.parking}]]</li>
					<li><strong>테마</strong> : [[${vo.theme}]]</li>
					<li><strong>좋아요</strong> : [[${vo.likecount}]]</li>
		            </ul>
		          </section>
		        </div>
				<p>[[${vo.content}]]</p>
				<hr style="width: 100%;">
				<div id="map" style="width:100%;height:500px;"></div>
		      </div>
		    </article>
		  </div>
		</div>
		
	<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=eceae8f48d6cfa28f55de551f70f135b&libraries=services"></script>
	<script>
		var mapContainer = document.getElementById('map'), // 지도를 표시할 div 
		    mapOption = {
		        center: new kakao.maps.LatLng(33.450701, 126.570667), // 지도의 중심좌표
		        level: 3 // 지도의 확대 레벨
		    };  
		
		// 지도를 생성합니다    
		var map = new kakao.maps.Map(mapContainer, mapOption); 
		
		// 주소-좌표 변환 객체를 생성합니다
		var geocoder = new kakao.maps.services.Geocoder();
		
		// 주소로 좌표를 검색합니다
		geocoder.addressSearch('[[${vo.address}]]', function(result, status) {
		
		    // 정상적으로 검색이 완료됐으면 
		     if (status === kakao.maps.services.Status.OK) {
		
		        var coords = new kakao.maps.LatLng(result[0].y, result[0].x);
		
		        // 결과값으로 받은 위치를 마커로 표시합니다
		        var marker = new kakao.maps.Marker({
		            map: map,
		            position: coords
		        });
		
		        // 인포윈도우로 장소에 대한 설명을 표시합니다
		        var infowindow = new kakao.maps.InfoWindow({
		            content: '<div style="width:150px;text-align:center;padding:6px 0;">[[${vo.name}]]</div>'
		        });
		        infowindow.open(map, marker);
		
		        // 지도의 중심을 결과값으로 받은 위치로 이동시킵니다
		        map.setCenter(coords);
		    } 
		});    
		
		
		</script>
		
	</body>
</html>
