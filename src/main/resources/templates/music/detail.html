<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<div class="wrapper" id="wrapper">
	  <div class="container" id="main">
	    <article id="content">
	      <header>
	        <h2>[[${vo.title}]]</h2>
	        <p>[[${vo.album}]]</p>
	      </header>
	      <div class="row">
	        <div class="col-3 col-12-medium">
	          <span class="image fit">
	            <img th:src="${vo.poster}" alt="음악 이미지">
	          </span>
	        </div>
	        <div class="col-9 col-12-medium">
	          <section class="box">
	            <ul>
	              <li>
					  <strong>랭킹</strong> :
					  [[${vo.rank}]]
					
					  <span th:if="${#strings.trim(vo.state) == '상승'}" style="font-size: 15px; color: blue;">
					    ▴[[${vo.idcrement}]]
					  </span>
					
					  <span th:if="${#strings.trim(vo.state) == '하강'}"  style="font-size: 15px; color: red;">
					    ▾[[${vo.idcrement}]]
					  </span>
					</li>
	              <li><strong>가수</strong> : [[${vo.singer}]]</li>
	              <li><strong>앨범</strong> : [[${vo.album}]]</li>
	              <li><strong>조회수</strong> : [[${vo.hit}]]</li>
	              <li><strong>좋아요</strong> : [[${vo.likecount}]]</li>
	            </ul>
	          </section>
	        </div>
	      </div>
	    </article>
		<section id="comment-section">
		  <h3>댓글</h3>

		  <!-- 댓글 입력 -->
		  <form class="comment-form">
		    <textarea placeholder="댓글을 입력하세요" v-model="msg" ref="msg"></textarea>
		    <button type="button" class="button" @click="insert()">등록</button>
		    <div style="clear: both;"></div>
		  </form>

		  <!-- 댓글 목록 -->
		  <ul class="comment-list">
		    <li class="comment-item" v-for="cvo in list">
		      <div class="comment-header">
		        <div class="comment-user">
		          <strong> ((cvo.name)) </strong>
		          <span class="comment-date">((cvo.dbday))</span>
		        </div>

		        <!-- 작성자일 때만 보이게 -->
		        <div class="comment-actions" v-if="sessionId === cvo.id">
		          <button type="button" class="comment-edit upbtn" :id="'u'+cvo.no" @click="updateForm(cvo.no)">수정</button>
		          <button type="button" class="comment-delete" @click="deletes(cvo.no)">삭제</button>
		        </div>
		      </div>
		      <p class="comment-content"> ((cvo.msg)) </p>
			  <form class="comment-form ups" :id="'up'+cvo.no" style="display: none;">
	  		    <textarea placeholder="댓글을 입력하세요" :id="'umsg'+cvo.no">((cvo.msg))</textarea>
	  		    <button type="button" class="button" @click="update(cvo.no)">수정</button>
	  		    <div style="clear: both;"></div>
	  		  </form>
		    </li>
		  </ul>
		</section>
	  </div>
	</div>
	<script>
		const commentApp = Vue.createApp({
			data(){
				return{
					list:[],
					cno:'[[${vo.no}]]',
					type:2,
					up:false,
					msg:'',
					sessionId:'[[${sessionId}]]'
				}
			},
			mounted(){
				axios.get('http://localhost/comment/list_vue/',{
					params:{
						cno:this.cno,
						type:this.type
					}
				}).then(response=>{
					this.list=response.data.list,
					this.cno=response.data.cno,
					this.type=response.data.type
				})
			},
			methods:{
				insert(){
					if(this.msg === ""){
						this.$refs.msg.focus()
						return
					}
					axios.post('http://localhost/comment/insert_vue/',{
						cno:this.cno,
						type:this.type,
						msg:this.msg
					}).then(response=>{
						this.cno=response.data.cno,
						this.type=response.data.type,
						this.list=response.data.list
					})
					this.msg=""
					this.$refs.msg.focus()
				},
				update(no){
					let msg = $('#umsg'+no).val()
					if(msg == ""){
						$('#umsg'+no).focus()
						return
					}
					
					axios.get('http://localhost/comment/update_vue/',{
						params:{
							cno:this.cno,
							type:this.type,
							msg:msg,
							no:no
						}
					}).then(response=>{
						this.cno=response.data.cno,
						this.type=response.data.type,
						this.list=response.data.list
						$('#up'+no).hide()
						$('#u'+no).text("수정")
					})
					
				},
				updateForm(no){
					$('.ups').hide()
					$('.upbtn').text("수정")
					if(this.up === false){
						this.up = true
						$('#up'+no).show()
						$('#u'+no).text("취소")
					}
					else{
						this.up = false
						$('#up'+no).hide()
						$('#u'+no).text("수정")
					}
				},
				deletes(no){
					axios.get('http://localhost/comment/delete_vue/',{
						params:{
							no:no,
							type:this.type,
							cno:this.cno
						}
					}).then(response=>{
						this.cno=response.data.cno,
						this.type=response.data.type,
						this.list=response.data.list
					})
				}
			}
		})
		commentApp.config.compilerOptions.delimiters=['((','))']
		commentApp.mount("#wrapper")
	</script>
</body>
</html>
