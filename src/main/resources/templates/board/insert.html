<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Board Write</title>
</head>
<body>

<div class="wrapper">
  <div class="container" id="main">

    <header>
      <h2>글 작성</h2>
      <p>게시글을 작성해주세요</p>
    </header>

    <hr>

    <form method="post" action="/board/insert_ok">

      <div class="row gtr-uniform">

        <div class="col-6 col-12-xsmall">
          <input type="text" name="name" placeholder="이름" required>
        </div>

        <div class="col-12">
          <input type="text" name="subject" placeholder="제목" required>
        </div>

        <div class="col-12">
          <textarea name="content" rows="10" placeholder="내용을 입력하세요"  required></textarea>
        </div>
        
		<div class="col-6 col-12-xsmall">
          <input type="password" name="pwd" placeholder="비밀번호" required>
        </div>
      </div>

      <hr>

      <ul class="actions">
        <li><input type="submit" value="등록" class="button"></li>
        <li><a href="/board/list" class="button">취소</a></li>
      </ul>

    </form>

  </div>
</div>

</body>
</html>
