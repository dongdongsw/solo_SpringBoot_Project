<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>

</head>
<body>
	<!-- Features 1 -->
				<div class="wrapper">
					<div class="container" style="width: 1700px;">
						<header class="major">
							<h2>조회수 가장 많은 음식점 Top 5</h2>
						</header>
						<div class="row"  style="flex-wrap: nowrap; ">
							<section class="col-3 col-12-narrower feature" th:each="fvo:${flist}">
								<div class="image-wrapper first">
									<a th:href="@{/food/detail(fno=${fvo.fno})}" class="image featured first">
										<img th:src="${fvo.poster}" alt="" />
									</a>
								</div>
								<header>
									<h3 class="h3title">[[${fvo.name}]]</h3>
								</header>
								
							</section>
							
						</div>
					</div>
					<ul class="actions major">
						<li><a href="/food/list" class="button" style="margin-top: 10px;">더 자세히 보기</a></li>
					</ul>
				</div>

			<!-- Promo -->
				<div id="promo-wrapper">
					<section id="promo">
						<h2>Neque semper magna et lorem ipsum adipiscing</h2>
						<a href="#" class="button">Breach the thresholds</a>
					</section>
				</div>

			<!-- Features 2 -->
				<div class="wrapper">
					<section class="container">
						<header class="major">
							<h2>운동화 TOP 3</h2>
						</header>
						<div class="row features">
							<section class="col-4 col-12-narrower feature" th:each="vo:${list}">
								<div class="image-wrapper first">
									<a th:href="@{/shoes/detail(goods_id=${vo.goods_id})}" class="image featured">
										<img th:src="${vo.img}" referrerpolicy="no-referrer" alt="" />
									</a>
								</div>
								<p>[[${vo.name_kor}]]</p>
							</section>
							
						</div>
						<ul class="actions major">
							<li><a href="/shoes/list" class="button">더 자세히 보기</a></li>
						</ul>
					</section>
				</div>
</body>
</html>
